name: Build master

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_REPO: ghcr.io/ethpandaops/slashoor

jobs:
  check:
    name: Run code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check go fmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test -race -vet=off ./...

  build-linux-amd64:
    name: Build linux/amd64 binary
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X github.com/slashoor/slashoor/cmd.Version=master -X github.com/slashoor/slashoor/cmd.GitCommit=${{ github.sha }}" \
            -o bin/slashoor .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slashoor_linux_amd64
          path: bin/slashoor

  build-linux-arm64:
    name: Build linux/arm64 binary
    needs: [check]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-w -s -X github.com/slashoor/slashoor/cmd.Version=master -X github.com/slashoor/slashoor/cmd.GitCommit=${{ github.sha }}" \
            -o bin/slashoor .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slashoor_linux_arm64
          path: bin/slashoor

  build-docker-amd64:
    name: Build amd64 docker image
    needs: [build-linux-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      sha-digest: ${{ steps.push.outputs.sha-digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: slashoor_linux_amd64
          path: bin

      - name: Prepare binary
        run: chmod +x bin/slashoor

      - name: Build and push amd64 image
        id: push
        run: |
          set -o pipefail
          docker build . --file Dockerfile-stub \
            --tag ${{ env.GHCR_REPO }}:master-amd64 \
            --tag ${{ env.GHCR_REPO }}:master-${{ steps.vars.outputs.sha_short }}-amd64 \
            --platform=linux/amd64
          docker push ${{ env.GHCR_REPO }}:master-amd64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker push ${{ env.GHCR_REPO }}:master-${{ steps.vars.outputs.sha_short }}-amd64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "sha-digest=${digest}" >> "$GITHUB_OUTPUT"

  build-docker-arm64:
    name: Build arm64 docker image
    needs: [build-linux-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      sha-digest: ${{ steps.push.outputs.sha-digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: slashoor_linux_arm64
          path: bin

      - name: Prepare binary
        run: chmod +x bin/slashoor

      - name: Build and push arm64 image
        id: push
        run: |
          set -o pipefail
          docker build . --file Dockerfile-stub \
            --tag ${{ env.GHCR_REPO }}:master-arm64 \
            --tag ${{ env.GHCR_REPO }}:master-${{ steps.vars.outputs.sha_short }}-arm64 \
            --platform=linux/arm64
          docker push ${{ env.GHCR_REPO }}:master-arm64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker push ${{ env.GHCR_REPO }}:master-${{ steps.vars.outputs.sha_short }}-arm64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "sha-digest=${digest}" >> "$GITHUB_OUTPUT"

  build-multiarch-manifest:
    name: Build multiarch docker manifest
    needs: [build-docker-amd64, build-docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push multiarch manifests
        id: manifest
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
          AMD64_DIGEST: ${{ needs.build-docker-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-docker-arm64.outputs.digest }}
          AMD64_SHA_DIGEST: ${{ needs.build-docker-amd64.outputs.sha-digest }}
          ARM64_SHA_DIGEST: ${{ needs.build-docker-arm64.outputs.sha-digest }}
        run: |
          set -o pipefail
          PAIRS="master-amd64@${AMD64_DIGEST} master-arm64@${ARM64_DIGEST}"
          PAIRS="${PAIRS} master-${SHA_SHORT}-amd64@${AMD64_SHA_DIGEST} master-${SHA_SHORT}-arm64@${ARM64_SHA_DIGEST}"

          # Create manifest for master-<sha>
          docker manifest create ${{ env.GHCR_REPO }}:master-${{ steps.vars.outputs.sha_short }} \
            --amend "${{ env.GHCR_REPO }}@${AMD64_SHA_DIGEST}" \
            --amend "${{ env.GHCR_REPO }}@${ARM64_SHA_DIGEST}"
          DIGEST=$(docker manifest push ${{ env.GHCR_REPO }}:master-${{ steps.vars.outputs.sha_short }} | tail -n1)
          PAIRS="${PAIRS} master-${SHA_SHORT}@${DIGEST}"

          # Create manifest for master
          docker manifest create ${{ env.GHCR_REPO }}:master \
            --amend "${{ env.GHCR_REPO }}@${AMD64_SHA_DIGEST}" \
            --amend "${{ env.GHCR_REPO }}@${ARM64_SHA_DIGEST}"
          DIGEST=$(docker manifest push ${{ env.GHCR_REPO }}:master | tail -n1)
          PAIRS="${PAIRS} master@${DIGEST}"

          # Create manifest for master-latest
          docker manifest create ${{ env.GHCR_REPO }}:master-latest \
            --amend "${{ env.GHCR_REPO }}@${AMD64_SHA_DIGEST}" \
            --amend "${{ env.GHCR_REPO }}@${ARM64_SHA_DIGEST}"
          DIGEST=$(docker manifest push ${{ env.GHCR_REPO }}:master-latest | tail -n1)
          PAIRS="${PAIRS} master-latest@${DIGEST}"
          echo "pairs=${PAIRS}" >> "$GITHUB_OUTPUT"

      - name: Mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: slashoor
          tags: ${{ steps.manifest.outputs.pairs }}
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
