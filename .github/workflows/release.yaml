name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version Number (e.g., '0.1.0')"
        required: true

env:
  DOCKERHUB_REPO: ethpandaops/slashoor
  GHCR_REPO: ghcr.io/ethpandaops/slashoor

permissions:
  contents: write

jobs:
  check:
    name: Run code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check go fmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test -race -vet=off ./...

  build-linux-amd64:
    name: Build linux/amd64 binary
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X github.com/slashoor/slashoor/cmd.Version=v${{ inputs.version }} -X github.com/slashoor/slashoor/cmd.GitCommit=${{ github.sha }}" \
            -o bin/slashoor .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slashoor_linux_amd64
          path: bin/slashoor

  build-linux-arm64:
    name: Build linux/arm64 binary
    needs: [check]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-w -s -X github.com/slashoor/slashoor/cmd.Version=v${{ inputs.version }} -X github.com/slashoor/slashoor/cmd.GitCommit=${{ github.sha }}" \
            -o bin/slashoor .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slashoor_linux_arm64
          path: bin/slashoor

  build-docker-amd64:
    name: Build amd64 docker image
    needs: [build-linux-amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: slashoor_linux_amd64
          path: bin

      - name: Prepare binary
        run: chmod +x bin/slashoor

      - name: Build and push amd64 image
        id: push
        run: |
          set -o pipefail
          docker build . --file Dockerfile-stub --provenance=false --sbom=false \
            --tag ${{ env.GHCR_REPO }}:v${{ inputs.version }}-amd64 \
            --platform=linux/amd64
          docker push ${{ env.GHCR_REPO }}:v${{ inputs.version }}-amd64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build-docker-arm64:
    name: Build arm64 docker image
    needs: [build-linux-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: slashoor_linux_arm64
          path: bin

      - name: Prepare binary
        run: chmod +x bin/slashoor

      - name: Build and push arm64 image
        id: push
        run: |
          set -o pipefail
          docker build . --file Dockerfile-stub --provenance=false --sbom=false \
            --tag ${{ env.GHCR_REPO }}:v${{ inputs.version }}-arm64 \
            --platform=linux/arm64
          docker push ${{ env.GHCR_REPO }}:v${{ inputs.version }}-arm64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build-multiarch-manifest:
    name: Build multiarch docker manifest
    needs: [build-docker-amd64, build-docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.attest.outputs.image }}
      digests: ${{ steps.attest.outputs.digests }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push multiarch manifests
        id: manifest
        env:
          VERSION: v${{ inputs.version }}
          AMD64_DIGEST: ${{ needs.build-docker-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-docker-arm64.outputs.digest }}
        run: |
          set -o pipefail
          PAIRS="${VERSION}-amd64@${AMD64_DIGEST} ${VERSION}-arm64@${ARM64_DIGEST}"

          # Create manifest for v<version>
          docker manifest create ${{ env.GHCR_REPO }}:v${{ inputs.version }} \
            --amend "${{ env.GHCR_REPO }}@${AMD64_DIGEST}" \
            --amend "${{ env.GHCR_REPO }}@${ARM64_DIGEST}"
          DIGEST=$(docker manifest push ${{ env.GHCR_REPO }}:v${{ inputs.version }} | tail -n1)
          PAIRS="${PAIRS} ${VERSION}@${DIGEST}"

          # Create manifest for latest
          docker manifest create ${{ env.GHCR_REPO }}:latest \
            --amend "${{ env.GHCR_REPO }}@${AMD64_DIGEST}" \
            --amend "${{ env.GHCR_REPO }}@${ARM64_DIGEST}"
          DIGEST=$(docker manifest push ${{ env.GHCR_REPO }}:latest | tail -n1)
          PAIRS="${PAIRS} latest@${DIGEST}"
          echo "pairs=${PAIRS}" >> "$GITHUB_OUTPUT"

      # Attest here and mirror in the next job, so a failed mirror can be
      # re-run without rebuilding the images.
      - name: Attest images
        id: attest
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: slashoor
          tags: ${{ steps.manifest.outputs.pairs }}
          mirror: "false"

  mirror:
    name: Mirror to Docker Hub
    needs: [build-multiarch-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: ${{ needs.build-multiarch-manifest.outputs.image }}
          tags: ${{ needs.build-multiarch-manifest.outputs.digests }}
          attest: "false"
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}

  create-release:
    name: Create GitHub Release
    needs: [build-multiarch-manifest, mirror]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: slashoor_linux_amd64
          path: slashoor_linux_amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: slashoor_linux_arm64
          path: slashoor_linux_arm64

      - name: Create release archives
        run: |
          cd slashoor_linux_amd64 && tar -czf ../slashoor_${{ inputs.version }}_linux_amd64.tar.gz slashoor && cd ..
          cd slashoor_linux_arm64 && tar -czf ../slashoor_${{ inputs.version }}_linux_arm64.tar.gz slashoor && cd ..

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags
          prev_tag=$(git tag --sort=-version:refname | grep -e "^v[0-9.]*$" | head -n 1)
          echo "previous release: $prev_tag"
          if [ "$prev_tag" ]; then
            changelog=$(git log --oneline --no-decorate $prev_tag..HEAD)
          else
            changelog=$(git log --oneline --no-decorate)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            slashoor_${{ inputs.version }}_linux_amd64.tar.gz
            slashoor_${{ inputs.version }}_linux_arm64.tar.gz
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Docker Image
            ```bash
            docker pull ${{ env.DOCKERHUB_REPO }}:v${{ inputs.version }}
            ```

            ## Release Artifacts
            | File | Platform |
            |------|----------|
            | slashoor_${{ inputs.version }}_linux_amd64.tar.gz | Linux x86_64 |
            | slashoor_${{ inputs.version }}_linux_arm64.tar.gz | Linux ARM64 |
